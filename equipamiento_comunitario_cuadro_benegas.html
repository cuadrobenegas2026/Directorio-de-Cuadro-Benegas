<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipamiento Comunitario - Cuadro Benegas</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS para el mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Estilos específicos para impresión */
        @media print {
            @page {
                margin: 1.5cm;
            }
            body {
                background-color: white !important;
                color: black !important;
            }
            #app-container {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }
            #map-container {
                width: 100% !important;
                height: 350px !important;
                margin-bottom: 20px !important;
                page-break-inside: avoid;
                border: 2px solid #ccc;
            }
            #sidebar {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                box-shadow: none !important;
            }
            .print-hide {
                display: none !important;
            }
            .print-card {
                page-break-inside: avoid !important;
                border: 1px solid #ddd !important;
                box-shadow: none !important;
                background-color: white !important;
                margin-bottom: 1rem !important;
            }
            .print-title {
                text-align: center;
                margin-bottom: 20px;
                display: block !important;
            }
        }

        /* Ocultar título de impresión en pantalla normal */
        .print-title {
            display: none;
        }

        /* Ajuste de scrollbar para el sidebar */
        #sidebar::-webkit-scrollbar {
            width: 8px;
        }
        #sidebar::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        #sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Asegurar que el mapa quede debajo de elementos fijos si los hubiera */
        .leaflet-container {
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans text-gray-800">

    <!-- Encabezado (Oculto en impresión para reemplazarlo por uno más limpio) -->
    <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center print-hide z-50">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot"></i>
                Equipamiento Comunitario
            </h1>
            <p class="text-blue-100 text-sm">Cuadro Benegas, San Rafael, Mendoza</p>
        </div>
        <button onclick="window.print()" class="bg-white text-blue-700 hover:bg-blue-50 px-4 py-2 rounded-lg font-semibold transition-colors shadow flex items-center gap-2">
            <i class="fa-solid fa-print"></i>
            Imprimir Reporte
        </button>
    </header>

    <!-- Título exclusivo para impresión -->
    <div class="print-title">
        <h1 style="font-size: 24pt; font-weight: bold; margin-bottom: 5px;">Guía de Equipamiento Comunitario</h1>
        <h2 style="font-size: 14pt; color: #555; margin-top: 0;">Cuadro Benegas, San Rafael, Mendoza</h2>
        <hr style="margin-top: 15px; margin-bottom: 20px;">
    </div>

    <!-- Contenedor Principal -->
    <main id="app-container" class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- Mapa -->
        <div id="map-container" class="w-full md:w-3/5 lg:w-2/3 h-[40vh] md:h-full bg-gray-200 order-1 md:order-2 border-b md:border-b-0 md:border-l border-gray-300 shadow-inner z-10">
            <div id="map" class="h-full w-full"></div>
        </div>

        <!-- Panel Lateral (Lista) -->
        <div id="sidebar" class="w-full md:w-2/5 lg:w-1/3 h-[60vh] md:h-full overflow-y-auto bg-gray-50 order-2 md:order-1 p-4 shadow-[10px_0_15px_-3px_rgba(0,0,0,0.1)] z-20 relative">
            <div class="sticky top-0 bg-gray-50 pb-4 pt-1 z-30 print-hide border-b border-gray-200 mb-4 flex justify-between items-end">
                <h2 class="text-lg font-bold text-gray-700">Directorio de Instituciones</h2>
                <span id="contador-lugares" class="text-xs font-semibold bg-blue-100 text-blue-800 px-2 py-1 rounded-full"></span>
            </div>
            
            <div id="lista-lugares" class="space-y-4">
                <!-- Las tarjetas se generan mediante JavaScript -->
            </div>
        </div>

    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Datos procesados con campos adicionales (horarios, profesionales, etc. - Datos simulados para estructura)
        const equipamientoData = [
            { id: 1, lat: -34.62051667, lng: -68.45497401, nombre: "Capilla Santa Clara de asis", categoria: "Religión", horarios: "Domingos 10:00 hs (Misa), Jueves 18:00 hs", prestaciones: "Misas, Bautismos, Catequesis", profesional: "Padre Roberto" },
            { id: 2, lat: -34.62031693, lng: -68.45489674, nombre: "Centro de Salud Nº 116 Cuadro Benegas", categoria: "Salud", horarios: "Lun a Vie 07:00 a 18:00 hs", prestaciones: "Medicina de Familia, Pediatría, Vacunatorio, Enfermería, Control de Embarazo", profesional: "Dra. Martinez, Lic. Gomez (Enfermería)" },
            { id: 3, lat: -34.68073649, lng: -68.42714716, nombre: "Escuela Nº 1-341 Dr. Luis Dellepaine", categoria: "Educación", horarios: "Lun a Vie 08:00 a 12:30 / 13:30 a 18:00 hs", prestaciones: "Nivel Inicial, Primario, Comedor Escolar", profesional: "Directora: Prof. Silvia Ramos" },
            { id: 4, lat: -34.62069617, lng: -68.45452521, nombre: "Destacamento Policial de Mza", categoria: "Seguridad", horarios: "Atención 24 hs", prestaciones: "Atención de denuncias, Prevención, Guardia, Certificados de domicilio", profesional: "Oficial Inspector a cargo" },
            { id: 5, lat: -34.62202531, lng: -68.46856820, nombre: "Planta Potabilizadora de Agua", categoria: "Infraestructura", horarios: "Lun a Vie 07:00 a 14:00 hs (Administración)", prestaciones: "Provisión de agua potable, Control de calidad", profesional: "Ingeniero de planta" },
            { id: 6, lat: -34.61442554, lng: -68.45424864, nombre: "Centro de Jubilados", categoria: "Social", horarios: "Lun a Vie 09:00 a 12:00 hs y 16:00 a 19:00 hs", prestaciones: "Talleres (Memoria, Yoga), Asistencia PAMI, Entrega de bolsones", profesional: "Comisión Directiva, Talleristas" },
            { id: 7, lat: -34.60198989, lng: -68.49911704, nombre: "Capilla Santa Rita de casia", categoria: "Religión", horarios: "Sábados 18:00 hs (Misa)", prestaciones: "Misas, Encuentros comunitarios", profesional: "Padre Roberto" },
            { id: 8, lat: -34.59676737, lng: -68.50951131, nombre: "Escuela Nº 368 Prof. Jose Amoroso", categoria: "Educación", horarios: "Lun a Vie 08:00 a 13:00 hs", prestaciones: "Educación Primaria, Biblioteca", profesional: "Director: Prof. Luis Arce" },
            { id: 9, lat: -34.62348669, lng: -68.46677190, nombre: "Estacion Transformadora Pedro Vargas", categoria: "Infraestructura", horarios: "Sin atención al público", prestaciones: "Distribución y regulación eléctrica de la zona", profesional: "Cuadrilla Técnica de Guardia" },
            { id: 10, lat: -34.61874041, lng: -68.45042581, nombre: "Escuela Nº 4-102 Antonio Buttini", categoria: "Educación", horarios: "Lun a Vie 07:30 a 13:00 / 13:30 a 19:00 hs", prestaciones: "Educación Secundaria, Talleres Técnicos, Pasantías", profesional: "Directora: Prof. Maria Torres" },
            { id: 11, lat: -34.64518206, lng: -68.42112113, nombre: "Escuela Nº 1-222 Adela N. O. de Poblet", categoria: "Educación", horarios: "Lun a Vie 08:00 a 12:30 hs", prestaciones: "Nivel Inicial y Primario", profesional: "Directora: Prof. Laura Diaz" },
            { id: 12, lat: -34.66484124, lng: -68.41222041, nombre: "Centro de Salud Nº 163 Julio Hannon", categoria: "Salud", horarios: "Lun a Vie 07:00 a 14:00 hs", prestaciones: "Clínica Médica, Control Niño Sano, Odontología, Entrega de leche", profesional: "Dr. Lopez (Clínico), Od. Sanchez" },
            { id: 13, lat: -34.62330314, lng: -68.45559087, nombre: "Club Social y Deportivo Cuadro Benegas", categoria: "Deportes", horarios: "Lun a Sab 16:00 a 22:00 hs", prestaciones: "Fútbol infantil y mayor, Hockey, Bochas, Salón de usos múltiples", profesional: "Profesores de Educación Física, DTs" },
            { id: 14, lat: -34.61981974, lng: -68.45468650, nombre: "Escuela Provincia del Chaco Nº 1-082", categoria: "Educación", horarios: "Lun a Vie 08:00 a 12:30 / 13:30 a 18:00 hs", prestaciones: "Educación Primaria, Actividades Artísticas", profesional: "Directora: Prof. Ana Garcia" },
            { id: 15, lat: -34.62018602, lng: -68.45469083, nombre: "Delegación Municipal", categoria: "Administración", horarios: "Lun a Vie 07:00 a 13:00 hs", prestaciones: "Trámites municipales, Pago de tasas, Recepción de reclamos viales y de limpieza", profesional: "Delegado Municipal" },
            { id: 16, lat: -34.64067434, lng: -68.46831559, nombre: "Sub Campamento Vialidad Nacional", categoria: "Infraestructura", horarios: "Lun a Vie 07:00 a 14:00 hs", prestaciones: "Mantenimiento de rutas nacionales y caminos aledaños", profesional: "Jefe de Campamento" },
            { id: 17, lat: -34.61844036, lng: -68.45304815, nombre: "Oficina Junta Vecinal Cuadro Benegas", categoria: "Social", horarios: "Mar y Jue 17:00 a 19:00 hs", prestaciones: "Reuniones vecinales, Gestión comunitaria, Asesoramiento", profesional: "Presidente de la Unión Vecinal" },
            { id: 18, lat: -34.65859485, lng: -68.42455111, nombre: "Club Deportivo El Salvador", categoria: "Deportes", horarios: "Lun a Vie 17:00 a 21:00 hs", prestaciones: "Canchas de Fútbol, Actividades recreativas, Eventos sociales", profesional: "Cuerpo Técnico e Instructores" }
        ];

        // Mapeo de categorías a íconos y colores
        const categoriaEstilos = {
            "Salud": { icon: "fa-hospital", color: "text-red-600", bg: "bg-red-100" },
            "Educación": { icon: "fa-school", color: "text-blue-600", bg: "bg-blue-100" },
            "Seguridad": { icon: "fa-shield-halved", color: "text-slate-700", bg: "bg-slate-200" },
            "Religión": { icon: "fa-church", color: "text-indigo-600", bg: "bg-indigo-100" },
            "Social": { icon: "fa-users", color: "text-orange-600", bg: "bg-orange-100" },
            "Deportes": { icon: "fa-futbol", color: "text-green-600", bg: "bg-green-100" },
            "Administración": { icon: "fa-building-columns", color: "text-teal-600", bg: "bg-teal-100" },
            "Infraestructura": { icon: "fa-industry", color: "text-gray-600", bg: "bg-gray-200" }
        };

        // Inicializar el mapa centrado en un promedio de las coordenadas
        const map = L.map('map').setView([-34.625, -68.45], 13);

        // Añadir capa de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const markers = {}; // Para guardar las referencias de los marcadores

        // Función para renderizar la lista y los marcadores
        function inicializarApp() {
            const listaContenedor = document.getElementById('lista-lugares');
            document.getElementById('contador-lugares').innerText = `${equipamientoData.length} registros`;

            equipamientoData.forEach(lugar => {
                const estilo = categoriaEstilos[lugar.categoria] || { icon: "fa-map-marker-alt", color: "text-blue-500", bg: "bg-blue-100" };

                // 1. Añadir marcador al mapa
                const markerHtmlStyles = `
                    background-color: white;
                    width: 30px;
                    height: 30px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 50%;
                    border: 2px solid #fff;
                    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
                `;
                
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="${markerHtmlStyles}"><i class="fa-solid ${estilo.icon} ${estilo.color}"></i></div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15],
                    popupAnchor: [0, -15]
                });

                const popupContent = `
                    <div class="p-1">
                        <h3 class="font-bold text-sm mb-1">${lugar.nombre}</h3>
                        <p class="text-xs text-gray-600 mb-2">${lugar.categoria}</p>
                        <p class="text-xs"><strong><i class="fa-regular fa-clock"></i></strong> ${lugar.horarios}</p>
                    </div>
                `;

                const marker = L.marker([lugar.lat, lugar.lng], { icon: customIcon })
                    .bindPopup(popupContent)
                    .addTo(map);
                
                markers[lugar.id] = marker;

                // 2. Generar tarjeta en la lista
                const card = document.createElement('div');
                card.className = `print-card bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md hover:border-blue-300 transition-all cursor-pointer`;
                card.onclick = () => enfocarLugar(lugar.id, lugar.lat, lugar.lng);
                
                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="mt-1 ${estilo.bg} ${estilo.color} w-10 h-10 rounded-full flex items-center justify-center shrink-0">
                            <i class="fa-solid ${estilo.icon} text-lg"></i>
                        </div>
                        <div class="flex-1 w-full">
                            <div class="flex justify-between items-start mb-1">
                                <h3 class="font-bold text-gray-800 text-md leading-tight pr-2">${lugar.nombre}</h3>
                                <span class="text-[10px] font-bold uppercase tracking-wider ${estilo.color} ${estilo.bg} px-2 py-0.5 rounded shrink-0">${lugar.categoria}</span>
                            </div>
                            
                            <div class="mt-3 space-y-2 text-sm text-gray-600">
                                <div class="flex items-start gap-2">
                                    <i class="fa-regular fa-calendar-clock mt-1 text-gray-400 w-4"></i>
                                    <p><strong>Atención:</strong> ${lugar.horarios}</p>
                                </div>
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-notes-medical mt-1 text-gray-400 w-4"></i>
                                    <p><strong>Prestaciones:</strong> ${lugar.prestaciones}</p>
                                </div>
                                <div class="flex items-start gap-2">
                                    <i class="fa-solid fa-user-tie mt-1 text-gray-400 w-4"></i>
                                    <p><strong>Profesional/Contacto:</strong> ${lugar.profesional}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                listaContenedor.appendChild(card);
            });
            
            // Ajustar el mapa para que muestre todos los puntos al cargar
            const group = new L.featureGroup(Object.values(markers));
            map.fitBounds(group.getBounds().pad(0.1));
        }

        // Función para cuando se hace clic en una tarjeta
        function enfocarLugar(id, lat, lng) {
            // Animación de vuelo en el mapa
            map.flyTo([lat, lng], 16, {
                animate: true,
                duration: 1.5
            });
            
            // Abrir el popup
            setTimeout(() => {
                markers[id].openPopup();
            }, 1500);

            // En móviles, hacer scroll hacia arriba para ver el mapa
            if (window.innerWidth < 768) {
                document.getElementById('map-container').scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Evitar problemas de visualización del mapa al redimensionar la ventana o imprimir
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
        
        window.addEventListener('beforeprint', () => {
            map.invalidateSize();
            // Centrar mapa para impresión
            const group = new L.featureGroup(Object.values(markers));
            map.fitBounds(group.getBounds());
        });

        // Ejecutar inicialización
        inicializarApp();

    </script>
</body>
</html>
