    /* Altura fija para el contenedor del mapa */

    /* Estilos elegantes para las etiquetas permanentes de los nombres de empresas */
    .custom-map-label {
      background-color: rgba(255, 255, 255, 0.95) !important;

      padding: 3px 8px !important;

      color: #1f2937 !important;

      white-space: nowrap !important;
    }
    /* Quitar bordes por defecto de Leaflet Tooltip */
    .leaflet-tooltip-top.custom-map-label::before {
      border-top-color: rgba(255, 255, 255, 0.95) !important;
    }
    .leaflet-tooltip-bottom.custom-map-label::before {
      border-bottom-color: rgba(255, 255, 255, 0.95) !important;
    }

    /* Estilos específicos para la etiqueta del mapa turístico (modo noche) */
    .custom-tourist-label {
      background-color: rgba(15, 23, 42, 0.9) !important;
      border: 1px solid #334155 !important;
      border-radius: 6px !important;
      padding: 3px 8px !important;
      font-size: 10px !important;
      font-weight: 700 !important;
      color: #f8fafc !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;

    }
    .leaflet-tooltip-top.custom-tourist-label::before {
      border-top-color: rgba(15, 23, 42, 0.9) !important;
    }

    /* Animación de pulso para el botón "Estoy Aquí" */
    @keyframes pulse-blue {
      0% {
        transform: scale(0.9);
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
      }
      100% {
        transform: scale(0.9);
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
      }
    }
    .user-location-pulsing {
      animation: pulse-blue 2s infinite;
      border-radius: 50%;
    }

    /* Estilos específicos de impresión en papel A4 */
    @media print {
      html, body {
        height: auto !important;
        overflow: visible !important;
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      @page {
        size: A4 portrait;
        margin: 15mm;
      }
      .no-print {
        display: none !important;
      }
      .print-header {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #d97706;
        padding-bottom: 15px;
        margin-bottom: 25px;
      }
      .print-grid {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 15px !important;
        overflow: visible !important;
      }
      .print-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1px solid #d1d5db !important;
        box-shadow: none !important;
        background-color: #ffffff !important;
        border-radius: 8px !important;
        padding: 15px !important;
      }
    }
    .print-header {
      display: none;
    }

    const getIconType = (tipo) => {
      switch (tipo) {

    const getTouristConfig = (categoria) => {
      switch(categoria) {

        case 'naturaleza': return { color: '#16a34a', icon: '🌲', label: 'Aventura y Valles' };
        case 'pueblos': return { color: '#4b5563', icon: '🗺️', label: 'Pueblos y Parajes' };
        case 'cultura': return { color: '#ea580c', icon: '📸', label: 'Cultura y Miradores' };
        case 'servicios': return { color: '#7e22ce', icon: '🏛️', label: 'Delegación/Servicios' };

    // --- COMPONENTE DE MAPA INTERACTIVO (Soporta ambos mapas y GPS "Estoy Aquí") ---
    function InteractiveMap({ data, isTouristMode, activeMarker, onMarkerClick, userLocation, onTriggerGPS }) {
      const mapInstanceRef = useRef(null);
      const markersRef = useRef({});
      const gpsMarkerRef = useRef(null);

      const getMarkerColor = (tipo) => {
        switch(tipo) {
          case 'bodega': return '#7e22ce';
          case 'aceite': return '#16a34a';
          case 'energia': return '#eab308';
          case 'fabrica': return '#4b5563';
          case 'municipal': return '#0284c7';
          case 'hotel': return '#2563eb';
          case 'destileria': return '#db2777';
          case 'restaurante': return '#ea580c';
          default: return '#ca8a04';
        }
      };

      // 1. Inicialización única del mapa
      useEffect(() => {
        const container = L.DomUtil.get('map');
        if (container != null) {
          container._leaflet_id = null;
        }

        // Centrado inicial de Cuadro Benegas
        const map = L.map('map', {
          center: [-34.636, -68.438],
          zoom: isTouristMode ? 9.5 : 12.5
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        mapInstanceRef.current = map;

        setTimeout(() => {
          map.invalidateSize();
        }, 150);

        return () => {
          map.remove();
          mapInstanceRef.current = null;
        };
      }, [isTouristMode]);

      // 2. Renderizado dinámico de marcadores (Empresas o Atractivos Turísticos)
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Limpiar marcadores antiguos
        Object.values(markersRef.current).forEach(marker => {
          map.removeLayer(marker);
        });
        markersRef.current = {};

        const currentMarkers = {};

        data.forEach(item => {
          if (item.coords) {
            let color = '';
            let symbol = '';
            let labelClass = 'custom-map-label';

            if (isTouristMode) {
              const cfg = getTouristConfig(item.categoria);
              color = cfg.color;
              symbol = cfg.icon;
              labelClass = 'custom-tourist-label';
            } else {
              color = getMarkerColor(item.tipo);
              symbol = getMarkerSymbol(item.tipo);
            }
            
            // Si es la Delegación Municipal de Cuadro Benegas (ID: 15) en el mapa de empresas, destacarla discretamente
            const isDelegacion = item.id === 15 && !isTouristMode;
            
            const customIcon = L.divIcon({
              className: 'custom-pin-marker',
              html: `<div style="
                background-color: ${color}; 
                width: 34px; 
                height: 34px; 
                border-radius: 50%; 
                border: 3px solid ${isDelegacion ? '#f59e0b' : 'white'}; 
                box-shadow: 0 3px 8px rgba(0,0,0,0.35); 
                display: flex; 
                align-items: center; 
                justify-content: center;
                transform: scale(${activeMarker === item.id ? '1.3' : '1'});
                transition: transform 0.2s ease;
                font-size: 16px;
                position: relative;
              ">
                ${symbol}
                ${isDelegacion ? `<span style="position:absolute; top:-4px; right:-4px; background:#f59e0b; width:10px; height:10px; border-radius:50%; border:1px solid white;"></span>` : ''}
              </div>`,
              iconSize: [34, 34],
              iconAnchor: [17, 17]
            });

            const marker = L.marker(item.coords, { icon: customIcon }).addTo(map);
            
            // Tooltip flotante con el nombre
            marker.bindTooltip(item.nombre, {
              permanent: true,
              direction: 'top',
              className: labelClass,
              offset: [0, -18]
            });
            
            const subtextPopup = isTouristMode ? item.subtexto : `${item.industria} • 📍 ${item.sede}`;

            marker.bindPopup(`
              <div style="font-family: 'Plus Jakarta Sans', sans-serif; min-width: 165px; padding: 2px;">
                <h4 style="font-weight: 800; margin: 0 0 2px 0; color: #111827; font-size:13px;">${item.nombre}</h4>
                <div style="font-size: 11px; color: #4b5563; margin-top:4px;">
                  ${subtextPopup}
                </div>
              </div>
            `);

            marker.on('click', () => {
              if (onMarkerClick) onMarkerClick(item.id);
            });

            currentMarkers[item.id] = marker;
          }
        });

        markersRef.current = currentMarkers;

        // Ajustar el zoom automático según los marcadores presentes
        if (data.length > 0) {
          const latLngs = data.filter(item => item.coords).map(item => item.coords);
          if (latLngs.length > 0) {
            const bounds = L.latLngBounds(latLngs);
            map.fitBounds(bounds, { padding: [60, 60], maxZoom: isTouristMode ? 12 : 14 });
          }
        }

      }, [data, isTouristMode]);

      // 3. Manejo reactivo de Georreferenciación GPS ("Estoy Aquí")
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;

        // Limpiar el marcador GPS anterior
        if (gpsMarkerRef.current) {
          map.removeLayer(gpsMarkerRef.current);
          gpsMarkerRef.current = null;
        }

        if (userLocation) {
          const gpsIcon = L.divIcon({
            className: 'user-location-pulsing',
            html: `<div style="
              background-color: #2563eb; 
              width: 18px; 
              height: 18px; 
              border-radius: 50%; 
              border: 3px solid white; 
              box-shadow: 0 0 12px rgba(37,99,235,0.8);
            "></div>`,
            iconSize: [18, 18],
            iconAnchor: [9, 9]
          });

          const gpsMarker = L.marker(userLocation, { icon: gpsIcon }).addTo(map);
          gpsMarker.bindTooltip("Estoy Aquí / Punto de Partida", {
            permanent: true,
            direction: 'bottom',
            className: 'custom-map-label',
            offset: [0, 10]
          });

          gpsMarkerRef.current = gpsMarker;
          map.setView(userLocation, isTouristMode ? 11 : 14);
        }
      }, [userLocation]);

      // 4. Centrado de cámara para elementos seleccionados
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (activeMarker && map && markersRef.current[activeMarker]) {
          const marker = markersRef.current[activeMarker];
          map.setView(marker.getLatLng(), isTouristMode ? 11.5 : 14.5);
          marker.openPopup();
        }
      }, [activeMarker]);

      return (
        <div className="relative">
          <div id="map" className="shadow-inner border border-neutral-200"></div>
          
          {/* Botón Flotante de GPS */}
          <button
            onClick={onTriggerGPS}
            className="absolute bottom-5 right-5 z-[1000] bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2.5 rounded-xl shadow-lg border border-blue-500 transition-all flex items-center gap-2 text-xs md:text-sm uppercase tracking-wider"
          >
            <span>🎯</span> ¿Dónde estoy?
          </button>
        </div>
      );
    }

                <div className="flex-grow bg-neutral-100">
                  <iframe 
                    src="./Historia,Presente y Futuro de Cuadro Benegas.html" 
                    className="w-full h-full border-none"
                    title="Informe del Distrito Cuadro Benegas"
                  ></iframe>
                </div>
                
              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* VENTANA MODAL FLOTANTE INTERACTIVA: GALERÍA COMUNITARIA   */}
          {/* ========================================================== */}
          {isGaleriaOpen && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-md z-[99999] flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-5xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-neutral-200">
                
                {/* Cabecera de la Galería */}
                <div className="bg-neutral-900 text-white p-4 flex justify-between items-center">
                  <div>
                    <span className="text-emerald-500 text-[10px] uppercase tracking-widest font-black block">Patrimonio Cultural y Humano</span>
                    <h2 className="font-bold text-sm md:text-base flex items-center gap-2">
                      📸 Galería de Reinas y Paisajes de Cuadro Benegas
                      {isAdmin && <span className="bg-amber-500 text-stone-950 text-[9px] px-2 py-0.5 rounded font-black tracking-widest animate-pulse">ADMINISTRADORA</span>}
                    </h2>
                  </div>
                  <div className="flex items-center gap-3">
                    {/* Botón de Acceso Admin */}
                    {!isAdmin ? (
                      <button 
                        onClick={() => setShowAdminLoginModal(true)} 
                        className="bg-neutral-800 hover:bg-neutral-700 text-amber-500 text-xs font-bold px-3 py-1.5 rounded-lg border border-amber-500/25 transition-all"
                      >
                        🔑 Acceso Admin
                      </button>
                    ) : (
                      <button 
                        onClick={handleLogoutAdmin} 
                        className="bg-red-950 hover:bg-red-900 text-red-400 text-xs font-bold px-3 py-1.5 rounded-lg border border-red-500/25 transition-all"
                      >
                        🚪 Cerrar Sesión
                      </button>
                    )}
                    
                    <button 
                      onClick={() => setIsGaleriaOpen(false)} 
                      className="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm"
                    >
                      Cerrar (X)
                    </button>
                  </div>
                </div>

                {/* Sub-Tabs de Categoría de la Galería */}
                <div className="bg-neutral-100 p-3 flex border-b border-neutral-200 justify-between items-center">
                  <div className="flex bg-white p-1 rounded-xl border border-neutral-200/50 shadow-inner">
                    <button 
                      onClick={() => setGaleriaTab("reinas")}
                      className={`px-6 py-2 rounded-lg text-xs font-extrabold transition-all uppercase tracking-wider ${galeriaTab === 'reinas' ? 'bg-amber-500 text-neutral-950 shadow-sm' : 'text-neutral-600 hover:text-neutral-950'}`}
                    >
                      👑 Reinas de la Vendimia
                    </button>
                    <button 
                      onClick={() => setGaleriaTab("lugares")}
                      className={`px-6 py-2 rounded-lg text-xs font-extrabold transition-all uppercase tracking-wider ${galeriaTab === 'lugares' ? 'bg-emerald-600 text-white shadow-sm' : 'text-neutral-600 hover:text-neutral-950'}`}
                    >
                      🌲 Paisajes y Lugares Bonitos
                    </button>
                  </div>
                  
                  <div className="text-xs text-neutral-500 font-medium hidden sm:block">
                    Total: {fotosList.filter(f => f.categoria === galeriaTab).length} fotos
                  </div>
                </div>

                {/* Cuerpo de la Galería */}
                <div className="flex-grow overflow-y-auto p-6 bg-neutral-50 flex flex-col md:flex-row gap-6">
                  
                  {/* Formulario de Carga: Visible ÚNICAMENTE para Administradora */}
                  {isAdmin && (
                    <div className="w-full md:w-80 bg-white p-5 rounded-2xl border border-neutral-200 shadow-sm h-fit flex-shrink-0">
                      <h3 className="text-sm font-extrabold text-stone-900 border-b border-emerald-500 pb-2 mb-4 flex items-center gap-1.5">
                        <span>➕ Subir Nueva Foto</span>
                      </h3>
                      
                      <form onSubmit={handleSubirFoto} className="space-y-4">
                        <div>
                          <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Título de la Foto / Año</label>
                          <input 
                            type="text" 
                            placeholder="Ej: Reina Vendimial 2026, Valle Grande..." 
                            className="w-full px-3 py-2 border border-neutral-300 rounded-lg text-xs font-medium focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                            value={nuevaFotoTitulo}
                            onChange={(e) => setNuevaFotoTitulo(e.target.value)}
                          />
                        </div>

                        <div>
                          <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Enlace directo de la Imagen</label>
                          <input 
                            type="text" 
                            placeholder="https://i.imgur.com/tu-imagen.jpg" 
                            className="w-full px-3 py-2 border border-neutral-300 rounded-lg text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                            value={nuevaFotoUrl}
                            onChange={(e) => setNuevaFotoUrl(e.target.value)}
                          />
                          <span className="text-[9px] text-neutral-400 block mt-1 leading-relaxed">
                            💡 Usa servicios gratuitos como <strong>postimages.org</strong> o <strong>imgur.com</strong> para subir tus fotos y pega el enlace directo que termina en .jpg o .png aquí.
                          </span>
                        </div>

                        <div>
                          <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Destino de publicación</label>
                          <div className="text-xs font-extrabold text-neutral-800 bg-neutral-100 px-3 py-2 rounded-lg border border-neutral-200">
                            {galeriaTab === "reinas" ? "👑 Pestaña de Reinas" : "🌲 Pestaña de Lugares"}
                          </div>
                        </div>

                        <button 
                          type="submit" 
                          className="w-full py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs uppercase tracking-wider rounded-lg transition-all shadow-md shadow-emerald-700/20"
                        >
                          Publicar Imagen
                        </button>
                      </form>
                    </div>
                  )}

                  {/* Cuadrícula de fotos */}
                  <div className="flex-grow">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {fotosList
                        .filter(foto => foto.categoria === galeriaTab)
                        .map(foto => (
                          <div key={foto.id} className="bg-white rounded-2xl border border-neutral-200 overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 relative group flex flex-col justify-between">
                            
                            <div className="h-44 overflow-hidden relative bg-neutral-100">
                              <img 
                                src={foto.url} 
                                alt={foto.titulo} 
                                className="w-full h-full object-cover group-hover:scale-105 transition-all duration-350"
                                onError={(e) => { e.target.src = 'https://placehold.co/600x400?text=Foto+No+Disponible'; }}
                              />
                              
                              {/* Botón de Borrar: Visible SOLO para ti como Administradora */}
                              {isAdmin && (
                                <button 
                                  onClick={() => handleEliminarFoto(foto.id)}
                                  className="absolute top-2 right-2 bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded-lg shadow-lg border border-red-500 transition-all font-bold text-xs"
                                  title="Eliminar esta foto"
                                >
                                  🗑️ Eliminar
                                </button>
                              )}
                            </div>

                            <div className="p-4 bg-white border-t border-neutral-100 flex-grow">
                              <h4 className="font-extrabold text-neutral-900 text-sm leading-snug">{foto.titulo}</h4>
                              <span className="text-[10px] text-neutral-400 font-bold block mt-1 uppercase tracking-widest">
                                {foto.categoria === "reinas" ? "👑 Representante Vendimial" : "🌲 Paisaje o Hito Local"}
                              </span>
                            </div>

                          </div>
                        ))}
                    </div>

                    {fotosList.filter(f => f.categoria === galeriaTab).length === 0 && (
                      <div className="text-center py-16 bg-white border border-neutral-200 rounded-2xl shadow-inner">
                        <span className="text-4xl">📸</span>
                        <h4 className="font-extrabold text-neutral-800 mt-3">Sin imágenes en esta pestaña</h4>
                        <p className="text-xs text-neutral-500 max-w-xs mx-auto mt-1 leading-relaxed">
                          {isAdmin 
                            ? "Utiliza el formulario de la izquierda para subir la primera imagen." 
                            : "Próximamente se subirán registros a esta categoría."}
                        </p>
                      </div>
                    )}
                  </div>

                </div>

              </div>
            </div>
          )}

          {/* ========================================================== */}
          {/* MODAL SECRETO DE CONTROL DE ACCESO (ADMINISTRADORA)       */}
          {/* ========================================================== */}
          {showLoginModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100000] flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 w-full max-w-sm border border-neutral-200 shadow-2xl relative">
                <button 
                  onClick={() => { setShowAdminLoginModal(false); setLoginError(""); }} 
                  className="absolute top-4 right-4 text-neutral-400 hover:text-neutral-600 font-extrabold"
                >
                  ✕
                </button>
                
                <div className="text-center mb-6">
                  <span className="text-3xl block">🔑</span>
                  <h3 className="font-black text-lg text-neutral-950 mt-2">Acceso de Administradora</h3>
                  <p className="text-xs text-neutral-500 mt-1 leading-relaxed">
                    Escribe la contraseña secreta para habilitar la subida y borrado de imágenes de reinas y paisajes.
                  </p>
                </div>

                <form onSubmit={handleLoginAdmin} className="space-y-4">
                  <div>
                    <label className="block text-[10px] font-bold text-neutral-500 uppercase mb-1">Contraseña Privada</label>
                    <input 
                      type="password" 
                      placeholder="Escribe tu clave" 
                      className="w-full px-3 py-2.5 border border-neutral-300 rounded-xl text-center font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                    />
                  </div>

                  {loginError && (
                    <p className="text-xs text-red-600 text-center font-semibold animate-pulse">{loginError}</p>
                  )}

                  <button 
                    type="submit" 
                    className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-stone-950 font-black text-xs uppercase tracking-wider rounded-xl transition-all shadow-md"
                  >
                    Verificar Clave
                  </button>
                </form>
              </div>
            </div>
          )}

          <footer className="bg-neutral-900 text-neutral-400 py-6 text-center text-xs border-t border-neutral-800 no-print">
            <p>Distrito Cuadro Benegas • Guía de Empresas e Industrias</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
